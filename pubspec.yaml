name: alfred
description: "Alfred — Your trusted partner, always by your side."
publish_to: 'none'

version: 1.0.27+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  file_picker: ^12.1.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  just_audio: ^0.10.6
  archive: ^4.2.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  google_generative_ai: ^0.4.7
  speech_to_text: ^7.4.0
  flutter_secure_storage: ^11.0.0
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/alfred_emblem_refined.png
    - assets/icons/bowtie_gold_emblem.jpg

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani/Rajdhani-Light.ttf
          weight: 300
        - asset: assets/fonts/Rajdhani/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani/Rajdhani-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/static/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/static/Inter_18pt-Black.ttf
          weight: 900
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel/static/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel/static/Cinzel-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cinzel/static/Cinzel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cinzel/static/Cinzel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cinzel/static/Cinzel-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cinzel/static/Cinzel-Black.ttf
          weight: 900
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron/static/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron/static/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron/static/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Orbitron/static/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron/static/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Orbitron/static/Orbitron-Black.ttf
          weight: 900