name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # don't pin old version, use latest stable which has Dart 3.12

      - name: Check Flutter version
        run: flutter --version && dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk alfred-arm64.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk alfred-armv7.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk alfred-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alfred-arm64.apk
            alfred-armv7.apk
            alfred-x86_64.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}